{% extends 'base.html' %}{% block content %}<section class="section"><h1>سلة المشتريات</h1><form method="post">{% csrf_token %}{% for p,q,subtotal in rows %}<div class="cart-row"><span>{{p.name}}</span><input type="number" min="0" max="{{p.stock}}" name="qty_{{p.id}}" value="{{q}}"><strong>{{subtotal}} دج</strong></div>{% empty %}<p>السلة فارغة.</p>{% endfor %}{% if rows %}<button>تحديث السلة</button><h2>الإجمالي: {{total}} دج</h2><a class="btn gold" href="{% url 'checkout' %}">إتمام الطلب · الدفع عند الاستلام</a>{% endif %}</form></section>{% endblock %}
