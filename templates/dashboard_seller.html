{% extends 'base.html' %}{% block content %}<section class="section"><div class="section-head"><h1>لوحة البائع</h1><a class="btn gold" href="{% url 'seller_product_add' %}">+ إضافة منتج</a></div><div class="stats"><div>المبيعات<strong>{{sales}} دج</strong></div><div>الطلبات<strong>{{orders_count}}</strong></div><div>المنتجات<strong>{{products|length}}</strong></div></div><div class="table">{% for p in products %}<div><b>{{p.name}}</b><span>{{p.price}} دج · المخزون {{p.stock}}</span></div>{% empty %}<p>أضف أول منتج لبدء البيع.</p>{% endfor %}</div></section>{% endblock %}
