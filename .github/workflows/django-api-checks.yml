name: Django API checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ["fix/production-api-routes"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-not-a-production-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "sqlite:///db.sqlite3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Generate temporary migration for current main schema
        run: python manage.py makemigrations store --noinput
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py test store.test_api --verbosity 2
