name: Django checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ["fix/comprehensive-safe-review"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-not-a-production-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "sqlite:///db.sqlite3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Django deployment security check
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-only-long-test-key-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DATABASE_URL: "sqlite:///db.sqlite3"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Apply committed migrations to temporary test database
        run: python manage.py migrate --noinput
      - name: Run regression and API tests
        run: python manage.py test --verbosity 2
      - name: Verify migration state
        run: python manage.py makemigrations --check --dry-run
