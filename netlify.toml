[build]
  publish = "."

# Proxy the storefront API and Django pages through the same Netlify origin.
# This lets the browser keep Django session/CSRF cookies on the storefront domain.
[[redirects]]
  from = "/api/*"
  to = "https://nova-markat.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://nova-markat.onrender.com/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "https://nova-markat.onrender.com/login/"
  status = 200
  force = true

[[redirects]]
